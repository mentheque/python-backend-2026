name: "HW5 Tests"

on:
  pull_request:
    branches: [ main ]
    paths: [ 'hw2/hw/**' ]
  push:
    branches: [ main ]
    paths: [ 'hw2/hw/**' ]

jobs:
  test-hw2:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    # Явный таймаут, чтобы job не висел 6 часов по умолчанию
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Pull PostgreSQL image with retry
      run: |
        for i in 1 2 3 4 5; do
          docker pull postgres:16-alpine && break
          echo "Pull attempt $i failed, retrying in 10s..."
          sleep 10
        done

    - name: Start PostgreSQL
      run: |
        docker run -d \
          --name postgres \
          -e POSTGRES_USER=shopuser \
          -e POSTGRES_PASSWORD=shoppass \
          -e POSTGRES_DB=shopdb \
          -p 5432:5432 \
          postgres:16-alpine

    - name: Wait for PostgreSQL to be ready
      run: |
        for i in $(seq 1 30); do
          if docker exec postgres pg_isready -U shopuser -d shopdb >/dev/null 2>&1; then
            echo "PostgreSQL is ready"
            exit 0
          fi
          echo "Waiting for PostgreSQL... ($i/30)"
          sleep 2
        done
        echo "PostgreSQL did not become ready in time"
        docker logs postgres
        exit 1

    - name: Install dependencies
      working-directory: hw2/hw
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      working-directory: hw2/hw
      env:
        PYTHONPATH: ${{ github.workspace }}/hw2/hw
        DATABASE_URL: postgresql+psycopg2://shopuser:shoppass@localhost:5432/shopdb
      run: |
        pytest tests -v --cov=shop_api --cov=store --cov-report=term-missing